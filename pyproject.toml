[project]
name = "huginn"
version = "0.1.0"
requires-python = "==3.14.*"
dependencies = [
    "fastapi==0.139.0",
    "httptools==0.8.0",
    "httpx==0.28.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "pyyaml==6.0.3",
    "structlog==26.1.0",
    "uvicorn==0.51.0",
    "uvloop==0.22.1",
]

[project.optional-dependencies]
anthropic = ["anthropic==0.116.0"]
openai = ["openai==2.45.0"]

[project.scripts]
server = "app.entrypoints.server:main"

[dependency-groups]
dev = [
    "huginn[anthropic,openai]",
    "import-linter==2.13",
    "pre-commit==4.6.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "respx==0.23.1",
    "ruff==0.15.21",
    "ty==0.0.58",
    "watchfiles==1.2.0",
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling==1.31.0"]

[tool.hatch.build.targets.wheel]
packages = ["app", "lib"]

[tool.importlinter]
root_packages = ["app", "lib"]

[[tool.importlinter.contracts]]
name = "top-level layers"
type = "layers"
layers = ["app.entrypoints", "app.features", "app.exts", "app.core", "lib"]

[[tool.importlinter.contracts]]
name = "lib must not import app"
type = "forbidden"
source_modules = ["lib"]
forbidden_modules = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires real external resources (PG/Redis/network)",
]

[tool.ruff.lint]
extend-select = [
    "ASYNC", # flake8-async
    "B",     # flake8-bugbear
    "DTZ",   # flake8-datetimez
    "G",     # flake8-logging-format
    "I",     # isort
    "LOG",   # flake8-logging
    "RUF",   # Ruff-specific rules
    "S",     # flake8-bandit
    "TID",   # flake8-tidy-imports
    "UP",    # pyupgrade
]

[tool.ruff.lint.flake8-tidy-imports]
banned-api."__future__".msg = "__future__ has no valid use since Python 3.14 (PEP 649 replaced annotations)"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.format]
quote-style = "single"

[tool.ty.rules]
all = "error"

[project]
name = "huginn"
version = "0.6.3"
requires-python = "==3.14.*"
dependencies = [
    "alembic==1.20.1",
    "asyncpg==0.32.0",
    "fastapi==0.162.2",
    "h2==4.4.1",
    "httptools==0.9.0",
    "httpx==0.28.1",
    "mcp==1.30.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "python-multipart==0.0.33",
    "pyyaml==6.0.3",
    "redis==7.1.0",
    "sqlalchemy[asyncio]==2.1.8",
    "structlog==26.1.0",
    "telegramify-markdown==1.4.2",
    "typer==0.28.0",
    "uvicorn==0.54.0",
    "uvloop==0.23.0",
]

[project.optional-dependencies]
anthropic = ["anthropic==0.116.0"]
openai = ["openai==2.45.0"]
documents = [
    "openpyxl==3.1.5",
    "pypdf==6.21.4",
    "python-docx==1.2.0",
]

[project.scripts]
huginn = "bin.cli:main"
server = "bin.server:main"

[dependency-groups]
dev = [
    "huginn[anthropic,openai]",
    "huginn[documents]",
    "import-linter==2.16",
    "pre-commit==4.7.0",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "respx==0.23.1",
    "ruff==0.17.4",
    "testcontainers==4.15.0",
    "ty==0.0.58",
    "watchfiles==1.3.0",
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling==1.33.0"]

[tool.uv]
constraint-dependencies = ["mako>=1.4.2"]

[tool.alembic]
script_location = "migrations"
prepend_sys_path = ["."]
version_locations = ["migrations/default/revisions"]
file_template = "%%(year)d%%(month).2d%%(day).2d%%(hour).2d%%(minute).2d_%%(rev)s"
timezone = "UTC"

[tool.hatch.build.targets.wheel]
packages = ["app", "bin", "lib"]

[tool.importlinter]
root_packages = ["app", "bin", "lib"]

[[tool.importlinter.contracts]]
name = "top-level layers"
type = "layers"
layers = [
    "bin",
    "app.providers",
    "app.features",
    "app.exts",
    "app.core",
    "app.contracts",
    "lib",
]

[[tool.importlinter.contracts]]
name = "lib must not import app"
type = "forbidden"
source_modules = ["lib"]
forbidden_modules = ["app", "bin"]

[[tool.importlinter.contracts]]
name = "lib packages stay independent"
type = "independence"
modules = [
    "lib.command",
    "lib.concurrency",
    "lib.container",
    "lib.database",
    "lib.decision",
    "lib.documents",
    "lib.guid",
    "lib.http",
    "lib.llm",
    "lib.media",
    "lib.mcp",
    "lib.observability",
    "lib.redis",
    "lib.result",
    "lib.router",
    "lib.temporal",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
asyncio_mode = "auto"
markers = [
    "integration: requires real external resources (PG/Redis/network)",
]

[tool.ruff.lint]
# Ruff's classic defaults, named so a release that widens the default set
# does not change which rules apply here.
select = ["E4", "E7", "E9", "F"]
extend-select = [
    "ASYNC", # flake8-async
    "B",     # flake8-bugbear
    "COM",   # flake8-commas
    "DTZ",   # flake8-datetimez
    "G",     # flake8-logging-format
    "I",     # isort
    "LOG",   # flake8-logging
    "PT",    # flake8-pytest-style
    "RUF",   # Ruff-specific rules
    "S",     # flake8-bandit
    "TID",   # flake8-tidy-imports
    "UP",    # pyupgrade
]

[tool.ruff.lint.flake8-tidy-imports]
banned-api."__future__".msg = "__future__ has no valid use since Python 3.14 (PEP 649 replaced annotations)"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.format]
quote-style = "single"

[tool.ty.rules]
all = "error"

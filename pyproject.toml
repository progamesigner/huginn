[project]
name = "huginn"
version = "0.1.0"
requires-python = "==3.14.*"
dependencies = []

[dependency-groups]
dev = [
    "pre-commit==4.6.0",
    "ruff==0.15.21",
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling==1.31.0"]

[tool.hatch.build.targets.wheel]
packages = ["app", "lib"]

[tool.ruff.lint]
extend-select = [
    "ASYNC", # flake8-async
    "B",     # flake8-bugbear
    "DTZ",   # flake8-datetimez
    "G",     # flake8-logging-format
    "I",     # isort
    "LOG",   # flake8-logging
    "RUF",   # Ruff-specific rules
    "S",     # flake8-bandit
    "TID",   # flake8-tidy-imports
    "UP",    # pyupgrade
]

[tool.ruff.lint.flake8-tidy-imports]
banned-api."__future__".msg = "__future__ has no valid use since Python 3.14 (PEP 649 replaced annotations)"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.format]
quote-style = "single"

repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.15.21
  hooks:
  - id: ruff-check
    args:
    - --fix
  - id: ruff-format

- repo: https://github.com/google/yamlfmt
  rev: v0.21.0
  hooks:
  - id: yamlfmt
    args:
    - -formatter
    - force_array_style=block,indentless_arrays=true,retain_line_breaks_single=true

- repo: local
  hooks:
  - id: emmylua-codeformat
    name: emmylua-codeformat
    entry: tools/pre-commit/emmylua-codeformat.sh
    language: script
    types:
    - lua
    pass_filenames: false
    args:
    - format
    - -ow
    - -w
    - lib/redis/resources
  - id: taplo-format
    name: taplo-format
    entry: taplo format
    language: node
    additional_dependencies:
    - '@taplo/cli@0.7.0'
    types:
    - toml
    args:
    - --option
    - array_auto_collapse=false
    - --option
    - "indent_string=    "
  - id: taplo-lint
    name: taplo-lint
    entry: taplo lint
    language: node
    additional_dependencies:
    - '@taplo/cli@0.7.0'
    files: ^pyproject\.toml$
    args:
    - --schema
    - https://json.schemastore.org/pyproject.json

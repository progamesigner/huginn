name: CI

on:
  pull_request:
  push:
    branches:
    - main
    tags:
    - v*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
    - run: uv sync --locked
    - run: uv run ruff check .
    - run: uv run ruff format --check .
    - run: uv run lint-imports
    - run: uv run ty check
    - run: uv run huginn config validate huginn.example.yaml
      env:
        ANTHROPIC_API_KEY: dummy-anthropic-token
        BIFROST_API_KEY: dummy-bifrost-token
        FELO_API_KEY: dummy-felo-token
        HUGINN_KEY_WEB: dummy-web-frontend-key
        MEMORY_MCP_TOKEN: dummy-memory-token
        MEMORY_MCP_URL: https://memory.example.internal
        OPENAI_API_KEY: dummy-openai-token
        SUPERSEARCH_API_KEY: dummy-supersearch-token
        TELEGRAM_BOT_TOKEN: dummy-telegram-bot-token
        TELEGRAM_WEBHOOK_SECRET: dummy-telegram-webhook-secret

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
    - run: uv sync --locked
    - run: uv run pytest -m 'not integration'

  e2e:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
    - run: uv sync --locked
    - run: uv run pytest -m integration

  publish:
    needs:
    - lint
    - test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - if: startsWith(github.ref, 'refs/tags/')
      env:
        TAG: ${{ github.ref_name }}
      run: |
        if [[ ! $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::tag $TAG is not vMAJOR.MINOR.PATCH"
          exit 1
        fi
        VERSION=$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')
        if [[ ${TAG#v} != "$VERSION" ]]; then
          echo "::error::tag $TAG does not match pyproject.toml version $VERSION"
          exit 1
        fi
    - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - if: github.event_name != 'pull_request'
      uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        flavor: |
          latest=false
        images: ghcr.io/${{ github.repository }}
        labels: |
          org.opencontainers.image.authors=${{ github.repository_owner }}
          org.opencontainers.image.vendor=${{ github.repository_owner }}
        tags: |
          type=sha,prefix=sha-
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
          type=raw,value=latest,enable={{is_default_branch}}
    - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

name: CI

on:
  pull_request:
  push:
    branches:
    - main
    tags:
    - v*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
    - run: uv sync --locked
    - run: uv run ruff check .
    - run: uv run ruff format --check .
    - run: uv run lint-imports
    - run: uv run ty check
    - run: uv run huginn config validate huginn.example.yaml
      env:
        ANTHROPIC_API_KEY: dummy-anthropic-token
        BIFROST_API_KEY: dummy-bifrost-token
        FELO_API_KEY: dummy-felo-token
        HUGINN_KEY_WEB: dummy-web-frontend-key
        MEMORY_MCP_TOKEN: dummy-memory-token
        MEMORY_MCP_URL: https://memory.example.internal
        OPENAI_API_KEY: dummy-openai-token
        SUPERSEARCH_API_KEY: dummy-supersearch-token
        TELEGRAM_BOT_TOKEN: dummy-telegram-bot-token
        TELEGRAM_WEBHOOK_SECRET: dummy-telegram-webhook-secret

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
    - run: uv sync --locked
    - run: uv run pytest -m 'not integration'

  e2e:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
    - run: uv sync --locked
    - run: uv run pytest -m integration

  publish:
    needs:
    - lint
    - test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - if: startsWith(github.ref, 'refs/tags/')
      env:
        TAG: ${{ github.ref_name }}
      run: |
        if [[ ! $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::tag $TAG is not vMAJOR.MINOR.PATCH"
          exit 1
        fi
        VERSION=$(python3 -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')
        if [[ ${TAG#v} != "$VERSION" ]]; then
          echo "::error::tag $TAG does not match pyproject.toml version $VERSION"
          exit 1
        fi
    - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
    - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
    - if: github.event_name != 'pull_request'
      uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        flavor: |
          latest=false
        images: ghcr.io/${{ github.repository }}
        labels: |
          org.opencontainers.image.authors=${{ github.repository_owner }}
          org.opencontainers.image.vendor=${{ github.repository_owner }}
        tags: |
          type=sha,prefix=sha-
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
          type=raw,value=latest,enable={{is_default_branch}}
    - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

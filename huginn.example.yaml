defaults:
  provider: openai
  model: gpt-5-mini
  max_completion_tokens: 16384

providers:
  openai:
    adapter: openai
    api_key:
      value_from:
        env: OPENAI_API_KEY
    models:
    - gpt-5-mini
  anthropic:
    adapter: anthropic
    api_key:
      value_from:
        env: ANTHROPIC_API_KEY
    models:
    - claude-sonnet-5
    vision:
    - claude-sonnet-5
    documents:
    - claude-sonnet-5
  bifrost:
    adapter: openai
    base_url: http://bifrost:8080/v1
    api_key:
      value_from:
        env: BIFROST_API_KEY
    models:
    - claude-sonnet-5
    - openai/gpt-5.6-sol
    cache_control:
    - claude-sonnet-5

tools:
  read_document:
    kind: read_document
    description: Read sections of extracted documents from the current conversation.
  websearch:
    kind: websearch
    api_key:
      value_from:
        env: FELO_API_KEY
  supersearch:
    kind: websearch
    description: Deep web search with broader, paid access; prefer for hard questions.
    api_key:
      value_from:
        env: SUPERSEARCH_API_KEY

mcp_servers:
  memory:
    transport: http
    url: ${MEMORY_MCP_URL}
    auth:
      value_from:
        env: MEMORY_MCP_TOKEN

skills:
  server: memory
  inject:
    agent: default
  bind:
    user: handle

agents:
  scout:
    description: Research agent — answers questions with web search and recall.
    provider: bifrost
    model: claude-sonnet-5
    max_completion_tokens: 32768
    max_iterations: 16
    turn_timeout: 900
    tool_timeout: 120
    instructions: |
      You are scout, a research assistant.
      Use websearch for anything time-sensitive.
      Use memory to recall prior context before answering.
    tools:
    - name: read_document
    - name: websearch
      params:
        max_results: 5
    - name: supersearch
      inject:
        max_results: 3
    mcp:
    - server: memory
      allow:
      - recall_memory_notes
      inject:
        agent: default
      bind:
        user: handle
    skills:
      enabled: true

  concierge:
    description: Fallback agent for chats with no specific binding.
    instructions: |
      You are concierge. Greet the user and hand off to scout for
      research questions; answer simple questions yourself.

api_keys:
  web-frontend:
    token:
      value_from:
        env: HUGINN_KEY_WEB
    agents:
    - scout
    - concierge
    agent: scout

transcription:
  kind: openai
  model: gpt-4o-mini-transcribe
  api_key:
    value_from:
      env: OPENAI_API_KEY

blobs:
  retention:
    generated: 30d
    inbound: null

channels:
  support_bot:
    kind: telegram
    token: ${TELEGRAM_BOT_TOKEN}
    secret_token: ${TELEGRAM_WEBHOOK_SECRET}
    webhook_base_url: https://huginn.example.com
    agents:
    - scout
    - concierge
    router:
      provider: openai
      model: gpt-5-mini
      fallback: concierge
      allowed:
      - scout
      - concierge

# A decision provider answers agent routing with a structured judgement instead of
# generated text. It sits in providers with type: decision; entries without a type
# are llm providers as above. The typesafe adapter speaks TypeSafe's own format and
# defaults to its public endpoint; point url elsewhere for a service speaking the
# same format, such as OpenRouter at https://openrouter.ai/api/alpha/decisions.
# The bifrost adapter speaks Bifrost's decisions api and always needs its url.
# providers:
#   jev:
#     type: decision
#     adapter: bifrost  # bifrost | typesafe
#     url: http://bifrost.default.svc.cluster.local:8080/v1/decisions
#     api_key:
#       value_from:
#         env: BIFROST_API_KEY
#     models: [typesafe/jev-1.13.0]
#     timeout: 3.0
# On a channel or API key router, opt in with:
# router:
#   engine: decision           # default: llm
#   provider: jev
#   model: typesafe/jev-1.13.0  # required; never inherits defaults.model
#   allowed: [assistant, coder]
#   fallback: assistant
#   history_turns: 6           # decision default: 6; llm default: 0
# Conversation excerpts and attachment hints go to the configured gateway and
# TypeSafe. Media bytes, document bodies, tool calls and results are excluded.

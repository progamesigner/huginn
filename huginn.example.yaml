defaults:
  provider: openai
  model: gpt-5-mini
  max_completion_tokens: 16384
  max_iterations: 10   # per agent overrides; built-in default: 10
  turn_timeout: 300    # seconds; per agent overrides; built-in default: 300

providers:
  openai:
    adapter: openai
    api_key:
      value_from:
        env: OPENAI_API_KEY
    models:
    - gpt-5-mini
  anthropic:
    adapter: anthropic
    api_key:
      value_from:
        env: ANTHROPIC_API_KEY
    models:
    - claude-sonnet-5
    vision:
    - claude-sonnet-5
    documents:
    - claude-sonnet-5
  bifrost:
    adapter: openai
    base_url: http://bifrost:8080/v1
    api_key:
      value_from:
        env: BIFROST_API_KEY
    models:
    - claude-sonnet-5
    - openai/gpt-5.6-sol
    cache_control:
    - claude-sonnet-5


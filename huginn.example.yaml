tools:
  read_document:
    kind: read_document
    description: Read sections of extracted documents from the current conversation.
  websearch:
    kind: websearch
    api_key:
      value_from:
        env: FELO_API_KEY
  supersearch:
    kind: websearch
    description: Deep web search with broader, paid access; prefer for hard questions.
    api_key:
      value_from:
        env: SUPERSEARCH_API_KEY
    # Seconds to wait for Felo to search and answer (default 60).
    timeout: 90
  illustrator:
    kind: images
    description: Draw an image the user asked for; it is sent to them directly.
    model: gpt-image-1
    api_key:
      value_from:
        env: OPENAI_API_KEY
    size: 1024x1024
  write_document:
    kind: write_document
    description: Write a Markdown, CSV, Word or Excel file for the user to download.
  narrator:
    kind: speech
    description: Read a short answer aloud as a voice message.
    model: gpt-4o-mini-tts
    voice: alloy
    format: opus
    api_key:
      value_from:
        env: OPENAI_API_KEY

mcp_servers:
  memory:
    transport: http
    url: ${MEMORY_MCP_URL}
    auth:
      value_from:
        env: MEMORY_MCP_TOKEN

assets:
  max_entries: 256
  sources:
    default:
      kind: mcp
      server: memory
      globs:
        skill: Agents/skills/**/SKILL.md
        command: Agents/commands/*.md
        subagent: Agents/agents/*/PROMPT.md
      inject:
        agent: default
      bind:
        user: memory_scope

# Shell hooks inherit only PATH, HOME and HUGINN_HOOK_* by default. bind values
# become HUGINN_HOOK_<UPPERCASE_KEY> and override inherited values. inherit_env
# adds exact environment variable names; unset names are skipped. Default: [].
# hooks:
#   notice:
#     kind: shell
#     command: [uptime]
#     inherit_env: [TZ]
#     bind:
#       user: handle
# Attach a hook to an agent with hooks: [notice].

agents:
  scout:
    description: Research agent — answers questions with web search and recall.
    provider: bifrost
    model: claude-sonnet-5
    max_completion_tokens: 32768
    max_iterations: 16
    turn_timeout: 900
    tool_timeout: 120
    instructions: |
      You are scout, a research assistant.
      Use websearch for anything time-sensitive.
      Use memory to recall prior context before answering.
    tools:
    - name: read_document
    - name: websearch
      params:
        max_results: 5
    - name: supersearch
      inject:
        max_results: 3
    - name: illustrator
    - name: narrator
    - name: write_document
    mcp:
    - server: memory
      allow:
      - recall_memory_notes
      inject:
        agent: default
      bind:
        user: handle
    skills:
      enabled: true
      source: default
    commands:
      enabled: false
      source: default
      allow: []
    subagents:
      enabled: false
      source: default
      allow: []
      max_concurrency: 1
      # definitions:
      #   reviewer:
      #     description: Review a self-contained task.
      #     instructions: Review only the supplied task and return your findings.
      #     tools: []
    brief:
      enabled: false
      writable: false
      source: default
      # A shared (not personally bound) brief accepts updates only from these handles.
      # writers: []

  concierge:
    description: Fallback agent for chats with no specific binding.
    instructions: |
      You are concierge. Greet the user and hand off to scout for
      research questions; answer simple questions yourself.

api_keys:
  web-frontend:
    token:
      value_from:
        env: HUGINN_KEY_WEB
    agents:
    - scout
    - concierge
    agent: scout

# kind: openai | gemini | elevenlabs. gemini also reads `mode` (smart, verbatim) and
# `language_codes`; elevenlabs reads the first language code. Unset `base_url` means
# the vendor's own endpoint.
transcription:
  kind: openai
  model: gpt-4o-mini-transcribe
  api_key:
    value_from:
      env: OPENAI_API_KEY

blobs:
  retention:
    generated: 30d
    inbound: null

channels:
  support_bot:
    kind: telegram
    token: ${TELEGRAM_BOT_TOKEN}
    secret_token: ${TELEGRAM_WEBHOOK_SECRET}
    webhook_base_url: https://huginn.example.com
    agents:
    - scout
    - concierge
    router:
      provider: openai
      model: gpt-5-mini
      fallback: concierge
      allowed:
      - scout
      - concierge

# A decision provider answers agent routing with a structured judgement instead of
# generated text. It sits in providers with type: decision; entries without a type
# are llm providers as above. The bifrost adapter speaks Bifrost's native
# /v1/decisions format and requires url. The typesafe adapter speaks TypeSafe's own
# format and defaults to its public endpoint; point url elsewhere for a service
# speaking the same format, such as OpenRouter at
# https://openrouter.ai/api/alpha/decisions. The openai adapter speaks OpenAI's
# decisions API and defaults to https://api.openai.com/v1/decisions; Bifrost v2.3.0+
# serves that format at /openai/v1/decisions.
# providers:
#   jev:
#     type: decision
#     adapter: openai  # bifrost | openai | typesafe
#     url: http://bifrost.default.svc.cluster.local:8080/openai/v1/decisions
#     api_key:
#       value_from:
#         env: BIFROST_API_KEY
#     models: [typesafe/jev-1.13.0]
#     timeout: 3.0
# On a channel or API key router, opt in with:
# router:
#   engine: decision           # default: llm
#   provider: jev
#   model: typesafe/jev-1.13.0  # required; never inherits defaults.model
#   allowed: [assistant, coder]
#   fallback: assistant
#   history_turns: 6           # decision default: 6; llm default: 0
#   min_confidence: 0.6        # optional; below it the fallback answers
#   min_margin: 0.2            # optional; top-two probability gap, same rule
# To compare engines on live traffic first, keep engine: llm and add a shadow; the
# LLM still answers, and each turn also asks the decision model in the background,
# logging whether the two agreed:
# router:
#   model: gpt-5-mini
#   shadow:
#     provider: jev
#     model: typesafe/jev-1.13.0
# Conversation excerpts and attachment hints go to the configured gateway and
# TypeSafe. Media bytes, document bodies, tool calls and results are excluded.
